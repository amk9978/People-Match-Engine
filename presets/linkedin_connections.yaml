# The LinkedIn connections export, from Settings, Data privacy, Get a copy of
# your data. Verified against a real Connections.csv: three lines of notes sit
# above the header, and a person's name arrives split across two columns.
#
#   match-engine match Connections.csv --map presets/linkedin_connections.yaml
#
# Position is free text. A real 1,413-connection export carries 826 distinct
# titles, so the distinct-profile optimization halves the work and no more. At
# that cardinality one completion holds a single target, which is 826 model
# calls for one feature, and past 1,598 distinct titles the model path refuses
# outright. The embedding scorer takes the same titles in one batch:
#
#   match-engine match Connections.csv --map presets/linkedin_connections.yaml \
#     --scorer embedding
skip_rows: 3
name_columns: [First Name, Last Name]
name_column: Person
company_column: Company
features:
  - name: position
    column: Position
    separator: ""
